<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="x-apple-disable-message-reformatting">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>Global Generation ID</title>
<!--
  Карточка GG ID для писем: письмо-приглашение и другие письма хаба. Источник: Global-Generation/Infra-Brand-Identity,
  gg-id/email-card.html (контракт и проверки: gg-id/README.md, раздел «Карточка GG ID», и src/build_gg_id.py).

  Подстановки. Хаб экранирует каждое значение как HTML (как invite_email.py), разметку в значения не кладёт:
    {{name}}       полное имя: «Иван Образцов»
    {{initials}}   1-2 буквы, первые буквы двух первых слов имени: «ИО»
    {{positions}}  должности через « · », от 0 до 3; нет должностей = пустая строка, строка схлопнется
    {{email}}      рабочая почта @global-generations.com (два места: текст и mailto)
    {{id}}         номер GG ID, до 14 символов: «GG 0042-7F3A»
    {{since}}      месяц в родительном падеже и год, читается после «с»: «марта 2024»

  В своё письмо вставлять блок между gg-id-card:start и gg-id-card:end (таблица шириной до 440 px).
  Подпись «логотип | ID» = картинка gg-id/email/gg-id-lockup-2x.png по https: хаб отдаёт кит из /assets/gg-id/.
  Тёмная тема: Apple Mail видит color-scheme и оставляет карточку navy; Gmail на Android тёмный фон не трогает;
  Gmail на iPhone инвертирует цвета карточки, текст остаётся контрастным, подпись остаётся на своей navy-плашке.
  Шрифт системный (Montserrat только если он установлен), внешних шрифтов и скриптов нет.
-->
<style>
  body{margin:0;padding:0;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%}
  table{border-collapse:collapse;mso-table-lspace:0;mso-table-rspace:0}
  img{border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic}
  @media only screen and (max-width:480px){
    .gidm-wrap{padding:16px 10px!important}
    .gidm-pad{padding:18px 20px 20px 12px!important}
  }
</style>
<style>
  :root{color-scheme:light dark;supported-color-schemes:light dark}
  @media (prefers-color-scheme:dark){
    body,.body,.gidm-page{background:#081b26!important}
    .gidm-card{box-shadow:0 0 0 1px #2f5d76!important}
  }
  a[x-apple-data-detectors]{color:inherit!important;text-decoration:none!important;font-size:inherit!important;font-family:inherit!important;font-weight:inherit!important;line-height:inherit!important}
  u + .body a{color:inherit;text-decoration:none;font-size:inherit;font-family:inherit;font-weight:inherit;line-height:inherit}
</style>
</head>
<body class="body" style="margin:0;padding:0;background:#eef3f9;">
<table role="presentation" class="gidm-page" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#eef3f9" style="width:100%;background:#eef3f9;">
<tr><td class="gidm-wrap" align="center" style="padding:28px 12px;">
<!-- gg-id-card:start -->
<!--[if mso]><table role="presentation" width="440" align="center" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
<table role="presentation" class="gidm-card" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#13445d" style="width:100%;max-width:440px;background:#13445d;border-radius:18px;border-collapse:separate;">
<tr><td class="gidm-pad" style="padding:20px 26px 22px 18px;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr><td style="padding:0;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
      <td valign="middle" style="padding:0;"><img src="https://levauth.global-generations-edu.com/assets/gg-id/email/gg-id-lockup-2x.png" width="175" height="40" alt="Global Generation ID" style="display:block;width:175px;height:40px;border:0;font-family:Montserrat,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;font-weight:700;line-height:40px;color:#ffffff;"></td>
      <td align="right" valign="middle" style="padding:0 0 0 12px;font-family:Montserrat,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:12px;font-weight:600;line-height:16px;color:#dee5e8;white-space:nowrap;"><span style="display:inline-block;width:8px;height:8px;border-radius:4px;background:#5cc3ec;vertical-align:middle;margin:0 7px 2px 0;"></span>Активен</td>
    </tr></table>
  </td></tr>
  <tr><td style="padding:18px 0 0 8px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
      <td width="58" valign="middle" style="width:58px;padding:0;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
          <td width="58" height="72" align="center" valign="middle" bgcolor="#2a7099" style="width:58px;height:72px;padding:0;background:#2a7099;border-radius:13px;font-family:Montserrat,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:22px;font-weight:700;line-height:72px;color:#ffffff;text-align:center;">{{initials}}</td>
        </tr></table>
      </td>
      <td valign="middle" style="padding:0 0 0 16px;">
        <div style="font-family:Montserrat,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:19px;font-weight:700;line-height:24px;color:#ffffff;">{{name}}</div>
        <div style="padding-top:4px;font-family:Montserrat,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:13px;font-weight:600;line-height:19px;color:#dee5e8;">{{positions}}</div>
        <div style="padding-top:3px;font-family:Montserrat,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:12.5px;font-weight:500;line-height:18px;color:#c2ced5;word-break:break-all;"><a href="mailto:{{email}}" style="color:#c2ced5;text-decoration:none;">{{email}}</a></div>
      </td>
    </tr></table>
  </td></tr>
  <tr><td style="padding:20px 0 0 8px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
      <td valign="bottom" style="padding:0 16px 0 0;">
        <div style="font-family:Montserrat,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:10px;font-weight:700;letter-spacing:1.2px;line-height:13px;color:#afbfc8;">НОМЕР GG ID</div>
        <div style="padding-top:4px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;letter-spacing:1px;line-height:20px;color:#ffffff;white-space:nowrap;font-variant-numeric:tabular-nums;">{{id}}</div>
      </td>
      <td valign="bottom" align="right" style="padding:0;text-align:right;">
        <div style="font-family:Montserrat,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:10px;font-weight:700;letter-spacing:1.2px;line-height:13px;color:#afbfc8;">В КОМАНДЕ С</div>
        <div style="padding-top:4px;font-family:Montserrat,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;font-weight:600;line-height:20px;color:#ffffff;white-space:nowrap;">{{since}}</div>
      </td>
    </tr></table>
  </td></tr>
  </table>
</td></tr>
</table>
<!--[if mso]></td></tr></table><![endif]-->
<!-- gg-id-card:end -->
</td></tr>
</table>
</body>
</html>
