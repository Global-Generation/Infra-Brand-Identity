<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="x-apple-disable-message-reformatting">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>Global Generation ID</title>
<!--
  Карточка GG ID и кнопки письма-приглашения в финальном стиле «Итог» (как письмо Infra-AWS #93, portal-auth invite_email.py):
  светлая карта, как в «Мои сервисы», с номером GG ID; белая кнопка «Задать пароль» с тонкой рамкой (стиль A кита); ссылка текстом
  «Инструкция: как войти»; вход в сервисах называется «Войти через GG ID». Источник: Global-Generation/Infra-Brand-Identity,
  gg-id/email-card.html (контракт и проверки: gg-id/README.md, раздел «В письме», и src/build_gg_id.py).

  Подстановки. Хаб экранирует каждое значение как HTML, разметку в значения не кладёт:
    {{name}}       полное имя: «Иван Образцов»
    {{positions}}  должности через « · », от 0 до 3; нет должностей = строку убрать
    {{email}}      рабочая почта @global-generations.com (два места: текст и mailto)
    {{id}}         номер GG ID, до 14 символов: «GG 0042-7F3A»
    {{link}}       одноразовая ссылка «Задать пароль» (кнопка и строка под ней)
    {{guide_url}}  открытая инструкция «Как войти» хаба: https://id.global-generations-edu.com/instructions/

  В своё письмо вставлять блоки между gg-id-card:start/end (карта, ширина до 440 px) и gg-id-actions:start/end (кнопка и ссылки).
  Статус «Активен» с голубой точкой показывать, только если хаб так говорит (иначе строку убрать). Фото и плашки инициалов нет, как в ките.
  Логотип = картинка gg-id/email/gg-logo-navy-2x.png по https: хаб отдаёт кит из /assets/gg-id/ (почта не рисует SVG и не показывает встроенные картинки).
  Тема светлая (color-scheme light): Apple Mail карту не перекрашивает. Gmail на iPhone в тёмной теме инвертирует цвета, но не картинки:
  текст остаётся контрастным, navy-логотип на тёмной карте читается хуже (как и в письме #93).
  Шрифт системный (Montserrat, только если он установлен), внешних шрифтов и скриптов нет.
-->
<style>
  body{margin:0;padding:0;background:#eef3f9;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%}
  table{border-collapse:collapse;mso-table-lspace:0;mso-table-rspace:0}
  img{border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic}
  a[x-apple-data-detectors]{color:inherit!important;text-decoration:none!important;font-size:inherit!important;font-family:inherit!important;font-weight:inherit!important;line-height:inherit!important}
  @media only screen and (max-width:600px){
    .gidm-wrap{padding:16px 10px!important}
    .gidm-px{padding-left:22px!important;padding-right:22px!important}
    .gidm-cta{width:100%!important}
    .gidm-cta a{display:block!important;text-align:center!important}
  }
  @media only screen and (max-width:480px){
    .gidm-pad{padding:18px 18px 20px!important}
  }
</style>
</head>
<body class="body" style="margin:0;padding:0;background:#eef3f9;">
<table role="presentation" class="gidm-page" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#eef3f9" style="width:100%;background:#eef3f9;">
<tr><td class="gidm-wrap" align="center" style="padding:28px 12px;">
<!--[if mso]><table role="presentation" width="560" align="center" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:100%;max-width:560px;background:#ffffff;border:1px solid #e2e8f0;border-radius:14px;">
<tr><td class="gidm-px" style="padding:30px 36px 30px;">
<!-- gg-id-card:start -->
<!--[if mso]><table role="presentation" width="440" align="center" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
<table role="presentation" class="gidm-card" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#e9f3fa" style="width:100%;max-width:440px;background-color:#e9f3fa;background-image:linear-gradient(118deg,#f8fbfd 0%,#dcedf8 36%,#e6eef9 60%,#d8eef9 84%,#eef5fb 100%);border:1px solid #cfe0ec;border-radius:18px;border-collapse:separate;">
<tr><td class="gidm-pad" style="padding:20px 24px 22px;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
    <td valign="middle" style="padding:0 11px 0 0;"><img src="https://id.global-generations-edu.com/assets/gg-id/email/gg-logo-navy-2x.png" width="111" height="28" alt="Global Generation" style="display:block;width:111px;height:28px;border:0;font-family:Montserrat,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:13px;font-weight:700;line-height:28px;color:#13445d;"></td>
    <td valign="middle" style="border-left:1px solid #b9ccda;padding:0 0 0 11px;font-family:Montserrat,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:13px;font-weight:600;line-height:20px;color:#13445d;white-space:nowrap;">ID</td>
  </tr></table>
  <div style="padding-top:18px;font-family:Montserrat,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:19px;font-weight:700;line-height:24px;color:#0b2433;">{{name}}</div>
  <div style="padding-top:3px;font-family:Montserrat,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:13px;font-weight:600;line-height:19px;color:#284a5f;">{{positions}}</div>
  <div style="padding-top:2px;font-family:Montserrat,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:12.5px;font-weight:500;line-height:18px;color:#284a5f;word-break:break-all;"><a href="mailto:{{email}}" style="color:#284a5f;text-decoration:none;">{{email}}</a></div>
  <div style="padding-top:8px;font-family:Montserrat,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:12.5px;font-weight:600;line-height:16px;color:#284a5f;"><span style="display:inline-block;width:8px;height:8px;border-radius:4px;background:#009CDC;vertical-align:middle;margin:0 7px 2px 0;"></span>Активен</div>
  <div style="padding-top:16px;font-family:Montserrat,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:10px;font-weight:700;letter-spacing:1.4px;line-height:13px;color:#3b5568;text-transform:uppercase;">Номер GG ID</div>
  <div style="padding-top:4px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;letter-spacing:1px;line-height:20px;color:#0b2433;white-space:nowrap;">{{id}}</div>
</td></tr>
</table>
<!--[if mso]></td></tr></table><![endif]-->
<!-- gg-id-card:end -->
<!-- gg-id-actions:start -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" class="gidm-cta" style="margin:24px 0 10px;border-collapse:separate;"><tr>
  <td bgcolor="#ffffff" style="border-radius:14px;border:1px solid #c9d5e1;background:#ffffff;mso-padding-alt:16px 32px;"><a href="{{link}}" style="display:inline-block;padding:16px 32px;font-family:Montserrat,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:15px;font-weight:700;line-height:20px;letter-spacing:-0.005em;color:#13445d;text-decoration:none;border-radius:14px;">Задать пароль</a></td>
</tr></table>
<div style="font-family:Montserrat,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:12px;line-height:1.55;color:#64748b;margin:0 0 24px;">Кнопка не нажимается? Скопируйте ссылку в браузер:<br><a href="{{link}}" style="color:#0077a8;word-break:break-all;">{{link}}</a></div>
<div style="font-family:Montserrat,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;line-height:1.6;color:#334155;margin:0 0 10px;">Первый раз? Пошаговая инструкция покажет, как войти, и открывается без пароля.</div>
<div style="font-family:Montserrat,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;font-weight:700;line-height:20px;margin:0 0 22px;"><a href="{{guide_url}}" style="color:#13445d;text-decoration:underline;text-underline-offset:3px;">Инструкция: как войти</a></div>
<div style="font-family:Montserrat,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;font-size:14px;line-height:1.6;color:#334155;margin:0;">Потом в любом сервисе нажмите «Войти через GG&nbsp;ID».</div>
<!-- gg-id-actions:end -->
</td></tr>
</table>
<!--[if mso]></td></tr></table><![endif]-->
</td></tr>
</table>
</body>
</html>
